name: Validate extension

on:
  push:
    branches:
      - main
      - "feat/**"
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('src/manifest.json', 'utf8'))"
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-tab-manager-0.5
          path: dist/firefox-tab-manager-0.5.zip
          if-no-files-found: error
