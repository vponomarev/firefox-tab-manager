<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Browsing history</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 0;
                font-family: sans-serif;
                line-height: 1.5;
                background: #fff;
                color: #333;
            }
            h1 {
                text-align: center;
                padding: 15px;
                margin: 0;
                background: #f3f3f3;
                border-bottom: 1px solid #ddd;
                font-size: 1.5em;
            }
            .controls {
                padding: 15px;
                background: #f9f9f9;
                border-bottom: 1px solid #eee;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
            }
            .controls input {
                flex: 1;
                min-width: 200px;
                padding: 8px;
                font-size: 14px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            .controls .count {
                font-size: 14px;
                color: #555;
                white-space: nowrap;
            }
            .controls button {
                padding: 8px 12px;
                min-height: 44px;
                font-size: 14px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            .controls #exportCsv {
                background: #27ae60;
                color: white;
            }
            .controls #exportJson {
                background: #3498db;
                color: white;
            }
            .controls #openVisits {
                background: #27ae60;
                color: white;
            }
            .container {
                max-width: 100%;
                overflow-x: auto;
                height: calc(100vh - 60px);
            }
            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
            }
            th,
            td {
                padding: 10px;
                border-bottom: 1px solid #eee;
                text-align: left;
                vertical-align: top;
            }
            th {
                background-color: #f5f5f5;
                position: sticky;
                top: 0;
                z-index: 10;
                box-shadow: 0 1px 0 #ddd;
            }
            th:nth-child(1),
            td:nth-child(1) {
                width: 25%;
            }
            th:nth-child(2),
            td:nth-child(2) {
                width: 50%;
            }
            th:nth-child(3),
            td:nth-child(3) {
                width: 25%;
            }

            .title,
            .url {
                word-wrap: break-word;
                white-space: pre-wrap;
                font-size: 0.95em;
                line-height: 1.4;
            }
            .title {
                font-weight: 500;
            }
            .url {
                font-family: monospace;
                color: #2c3e50;
            }
            .date {
                font-size: 0.9em;
                color: #666;
                white-space: nowrap;
            }
            .empty {
                text-align: center;
                padding: 30px;
                color: #888;
                font-style: italic;
            }

            @media (max-width: 900px) {
                .controls > * {
                    flex: 1 1 100%;
                }
                .controls button {
                    width: 100%;
                }
                .container {
                    height: auto;
                    overflow: visible;
                    padding: 10px;
                }
                table,
                tbody {
                    display: block;
                }
                thead {
                    display: none;
                }
                tbody tr {
                    display: block;
                    margin-bottom: 12px;
                    border: 1px solid #ddd;
                    border-radius: 8px;
                    overflow: hidden;
                }
                tbody td {
                    display: flex;
                    width: 100% !important;
                    gap: 12px;
                    border-bottom: 1px solid #eee;
                    white-space: normal;
                }
                tbody td::before {
                    content: attr(data-label);
                    flex: 0 0 28%;
                    font-weight: 600;
                    color: #555;
                }
                tbody td.empty {
                    display: block;
                }
                tbody td.empty::before {
                    content: none;
                }
            }
        </style>
        <link rel="stylesheet" href="shared.css" />
    </head>
    <body>
        <h1>Browsing history</h1>

        <div class="controls">
            <input
                type="text"
                id="filterInput"
                placeholder="Filter by title or URL..."
            />
            <div id="countInfo" class="count">Loading...</div>
            <button id="exportCsv">📄 Export CSV</button>
            <button id="exportJson">📦 Export JSON</button>
            <button id="openVisits" hidden>📚 Open Tracked pages</button>
        </div>

        <div class="container">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>URL</th>
                        <th>Visited</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr>
                        <td colspan="3" class="empty">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script src="export.js"></script>
        <script src="platform.js"></script>
        <script src="history.js"></script>
    </body>
</html>
