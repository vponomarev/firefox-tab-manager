<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Visited pages</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 0;
                font-family: sans-serif;
                line-height: 1.5;
                background: #fff;
                color: #333;
            }
            h1 {
                text-align: center;
                padding: 15px;
                margin: 0;
                background: #f3f3f3;
                border-bottom: 1px solid #ddd;
                font-size: 1.5em;
            }
            .controls {
                padding: 15px;
                background: #f9f9f9;
                border-bottom: 1px solid #eee;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
            }
            .controls input {
                flex: 1;
                min-width: 200px;
                padding: 8px;
                font-size: 14px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            .controls .count {
                font-size: 14px;
                color: #555;
                white-space: nowrap;
            }
            .controls button {
                padding: 8px 12px;
                font-size: 14px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                color: white;
            }
            #exportCsv {
                background: #27ae60;
            }
            #exportJson {
                background: #3498db;
            }
            #clearAll {
                background: #e74c3c;
            }
            #previousPage,
            #nextPage {
                background: #7f8c8d;
            }
            .controls button:disabled {
                cursor: default;
                opacity: 0.5;
            }
            .container {
                max-width: 100%;
                overflow-x: auto;
                height: calc(100vh - 60px);
            }
            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
            }
            th,
            td {
                padding: 10px;
                border-bottom: 1px solid #eee;
                text-align: left;
                vertical-align: top;
            }
            th {
                background-color: #f5f5f5;
                position: sticky;
                top: 0;
                z-index: 10;
                box-shadow: 0 1px 0 #ddd;
            }
            th:nth-child(1),
            td:nth-child(1) {
                width: 24%;
            }
            th:nth-child(2),
            td:nth-child(2) {
                width: 40%;
            }
            th:nth-child(3),
            td:nth-child(3),
            th:nth-child(4),
            td:nth-child(4) {
                width: 13%;
                white-space: nowrap;
            }
            th:nth-child(5),
            td:nth-child(5) {
                width: 5%;
                text-align: center;
            }
            th:nth-child(6),
            td:nth-child(6) {
                width: 5%;
                text-align: center;
            }
            .title,
            .url {
                word-wrap: break-word;
                word-break: break-word;
                white-space: pre-wrap;
                font-size: 0.95em;
                line-height: 1.4;
            }
            .title {
                font-weight: 500;
            }
            .url {
                font-family: monospace;
                color: #2c3e50;
            }
            .url a {
                color: #2c3e50;
                text-decoration: none;
            }
            .url a:hover {
                text-decoration: underline;
            }
            .date {
                font-size: 0.9em;
                color: #666;
                white-space: nowrap;
            }
            .close-btn {
                padding: 6px 10px;
                background: #e74c3c;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.9em;
            }
            .close-btn:hover {
                background: #c0392b;
            }
            .empty {
                text-align: center;
                padding: 30px;
                color: #888;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1>Visited pages</h1>

        <div class="controls">
            <input
                type="text"
                id="filterInput"
                placeholder="Filter by title or URL..."
            />
            <div id="countInfo" class="count">Loading...</div>
            <button id="exportCsv">📄 Export CSV</button>
            <button id="exportJson">📦 Export JSON</button>
            <button id="clearAll">🗑 Clear all</button>
            <button id="previousPage">Previous</button>
            <span id="pageInfo" class="count"></span>
            <button id="nextPage">Next</button>
        </div>

        <div class="container">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>URL</th>
                        <th>First visit</th>
                        <th>Last visit</th>
                        <th>Visits</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="visits-body">
                    <tr>
                        <td colspan="6" class="empty">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script src="export.js"></script>
        <script src="visits.js"></script>
    </body>
</html>
